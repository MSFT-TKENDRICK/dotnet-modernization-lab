name: Starter CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Show selected SDK
        run: dotnet --version
      - name: Restore locked dependencies
        run: dotnet restore BookCatalog.sln --locked-mode
      - name: Build
        run: dotnet build BookCatalog.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test BookCatalog.sln --configuration Release --no-build --no-restore
